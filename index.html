<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Library</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles.css">
    </head>
    <body>
        <h1>My Library Project</h1>
        <button command="show-modal"  commandfor="my-dialog" class="addBtn">Add New Book</button>
        <dialog id="my-dialog">
            <h3>Enter Book Details</h3>
            <form action="" method="post">

                <label for="title">Title:</label>
                <input type="text" name="title" id="title" required>

                <label for="author">Author:</label>
                <input type="text" name="author" id="author" required>
            
                <label for="pages">Pages:</label>
                <input type="number" name="pages" id="pages" min="1" required>

                <fieldset>
                    <legend>Have you read the book?</legend>
                   
                    <input id="affirmative" type="radio" name="readStatus">
                    <label for="affirmative">Yes</label>

                    <input id="negative" type="radio" name="readStatus" checked>
                    <label for="negative"> No</label>
            
                </fieldset>
                
                <div>
                    <button type="submit" class="addBtn">Add Book</button>
                    <button type="button" command="close" commandfor="my-dialog" class="closeBtn">Close</button>
                </div>
            </form>
            
        </dialog>
        <table>
            <caption>List of books in the library</caption>
            <thead>
                <tr>
                    <th>No.</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Pages</th>
                    <th>Status</th>
                    <td></td>
                </tr>
            </thead>

            <tbody>
                
            </tbody>
        </table>
        <script src="./index.js"></script>
    </body>
</html>
